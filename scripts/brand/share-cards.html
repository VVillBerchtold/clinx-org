<!doctype html>
<!--
  The template for every share card: the picture a link to a page of clinx.org shows when it is shared.
  It draws one card, 1200 by 630. The words come from scripts/brand/share-cards.json. The script
  scripts/brand/make-share-cards.mjs opens this file once for each card, passes the card in as
  window.CARD and saves a picture; you do not open this file by hand.
  The name at the top is the drawn wordmark (public/brand/clinx-wordmark-on-dark.svg, from build.mjs).
  The tile pattern is the site's state map with no letters. The bright tiles are the states with a
  340B reporting law, listed as "bright" in share-cards.json, and they are the same on every card.
  The look follows the home page in its dark setting: the same night colour, the same two typefaces,
  white words with the lilac accent.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClinX share card</title>
<style>
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 200 800; src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2') format('woff2'); }
@font-face { font-family: 'Instrument Sans'; font-weight: 400 700; src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; }
body { background: #080a1a; color: #f1f2fb; font-family: 'Instrument Sans', system-ui, sans-serif; position: relative; overflow: hidden; -webkit-font-smoothing: antialiased; }
/* Everything the eye reads sits inside the safe area: 72px from the left and right edges, 60px from the top and bottom. */
.say { position: absolute; left: 72px; top: 60px; bottom: 60px; width: 600px; display: flex; flex-direction: column; }
.mark { height: 34px; align-self: flex-start; }
.kicker { margin-top: auto; padding-top: 32px; display: flex; align-items: center; gap: 12px; font: 700 22px/1 'Instrument Sans', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #8f96ff; }
.kicker i { width: 10px; height: 10px; border-radius: 50%; background: #8f96ff; }
h1 { font: 800 120px/0.92 'Bricolage Grotesque', sans-serif; letter-spacing: -0.04em; margin-top: 22px; }
h1.long { font-size: 62px; line-height: 0.98; letter-spacing: -0.035em; }
h1.mid { font-size: 96px; }
h1 span { color: #8f96ff; }
p { font: 500 28px/1.35 'Instrument Sans', sans-serif; color: #b6bad9; margin-top: 26px; max-width: 580px; }
.where { margin-top: auto; padding-top: 24px; font: 600 24px/1 ui-monospace, 'SF Mono', Menlo, monospace; color: #f1f2fb; display: flex; align-items: center; gap: 14px; }
.where i { width: 12px; height: 12px; border-radius: 50%; background: #8f96ff; box-shadow: 0 0 0 6px rgba(143, 150, 255, 0.22); }
svg { position: absolute; right: 64px; top: 50%; translate: 0 -50%; width: 400px; height: auto; fill: #8f96ff; }
</style>
</head>
<body>
<div class="say">
  <img class="mark" src="../../public/brand/clinx-wordmark-on-dark.svg" alt="ClinX">
  <div class="kicker"><i></i><span id="kicker"></span></div>
  <h1 id="title"></h1>
  <p id="line"></p>
  <div class="where"><i></i><span id="where"></span></div>
</div>
<svg id="tiles" viewBox="0 0 472 340" aria-hidden="true"></svg>
<script>
const card = window.CARD;
const GRID = [["AK",0,0],["ME",10,0],["VT",9,1],["NH",10,1],["WA",0,2],["ID",1,2],["MT",2,2],["ND",3,2],["MN",4,2],["IL",5,2],["WI",6,2],["MI",7,2],["NY",8,2],["RI",9,2],["MA",10,2],["OR",0,3],["NV",1,3],["WY",2,3],["SD",3,3],["IA",4,3],["IN",5,3],["OH",6,3],["PA",7,3],["NJ",8,3],["CT",9,3],["CA",0,4],["UT",1,4],["CO",2,4],["NE",3,4],["MO",4,4],["KY",5,4],["WV",6,4],["VA",7,4],["MD",8,4],["DE",9,4],["AZ",1,5],["NM",2,5],["KS",3,5],["AR",4,5],["TN",5,5],["NC",6,5],["SC",7,5],["DC",8,5],["OK",3,6],["LA",4,6],["MS",5,6],["AL",6,6],["GA",7,6],["HI",0,7],["TX",3,7],["FL",8,7]];
const bright = new Set(card.bright);
const step = 42;
document.getElementById('tiles').innerHTML = GRID.map(([code, c, r]) =>
  `<rect x="${6 + c * step}" y="${6 + r * step}" width="36" height="36" rx="8" fill-opacity="${bright.has(code) ? 0.92 : 0.2}"/>`).join('');
const title = document.getElementById('title');
if (card.accent && card.title.endsWith(card.accent)) {
  title.append(card.title.slice(0, -card.accent.length));
  const span = document.createElement('span');
  span.textContent = card.accent;
  title.append(span);
} else title.textContent = card.title;
title.className = card.title.length > 30 ? 'long' : card.title.length > 12 ? 'mid' : '';
document.getElementById('kicker').textContent = card.kicker;
document.getElementById('line').textContent = card.line;
document.getElementById('where').textContent = card.where;
</script>
</body>
</html>
