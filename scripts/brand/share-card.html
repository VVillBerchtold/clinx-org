<!doctype html>
<!--
  The picture a link to ClinX.org shows when it is shared (public/brand/share-card.png).
  To redraw it: open this file in a browser window 1200 wide and 630 tall and save a picture of it.
  The name at the top is the drawn wordmark (clinx-wordmark-on-dark.svg, from build.mjs).
  The tile pattern is decoration: the grid is the site's state map with no letters, and the
  brightness of a tile stands for nothing. It never needs to change when a state is added.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClinX share card</title>
<style>
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 200 800; src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2') format('woff2'); }
@font-face { font-family: 'Instrument Sans'; font-weight: 400 700; src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; }
body { background: #080a1a; color: #f1f2fb; font-family: 'Instrument Sans', system-ui, sans-serif; position: relative; overflow: hidden; -webkit-font-smoothing: antialiased; }
.say { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 580px; display: flex; flex-direction: column; }
.mark { height: 34px; align-self: flex-start; }
h1 span { color: #8f96ff; }
h1 { font: 800 88px/0.94 'Bricolage Grotesque', sans-serif; letter-spacing: -0.03em; margin-top: auto; }
h1 span { display: block; }
p { font: 500 27px/1.35 'Instrument Sans', sans-serif; color: #b6bad9; margin-top: 28px; max-width: 560px; }
.where { margin-top: auto; font: 600 24px/1 ui-monospace, 'SF Mono', Menlo, monospace; color: #f1f2fb; display: flex; align-items: center; gap: 14px; }
.where i { width: 12px; height: 12px; border-radius: 50%; background: #8f96ff; box-shadow: 0 0 0 6px rgba(143, 150, 255, 0.22); }
svg { position: absolute; right: 56px; top: 50%; translate: 0 -50%; width: 480px; height: auto; fill: #8f96ff; }
</style>
</head>
<body>
<div class="say">
  <img class="mark" src="../../public/brand/clinx-wordmark-on-dark.svg" alt="ClinX">
  <h1>340B filings, <span>state by state.</span></h1>
  <p>Open data from public state filings. Every figure links to the page it came from.</p>
  <div class="where"><i></i>clinx.org</div>
</div>
