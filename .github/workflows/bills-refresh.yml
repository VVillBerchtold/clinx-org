# Daily bills refresh. Brings in the bills table, the federal notices table and
# the calendar table from the public bills repository, rebuilds the site and
# runs every check. It
# publishes only on a full pass, and only when the tables have changed.
#
# The tables themselves are refreshed in their own repository
# (clinx-340b-bills, every day at 10:23 UTC). This job runs after that one and
# only copies: it fetches nothing from a legislature or an agency and holds no key.
#
# Publishing is switched off until the owner decides it: the publish job runs
# only when the repository variable BILLS_PUBLISH_ENABLED is "true". Until then
# a run shows whether the new tables would pass, and changes nothing. It
# publishes the same files the checks passed on, with scripts/deploy/publish.sh,
# and then records the copied tables on main so ordinary builds show the same
# thing.
#
# On any failure it opens an issue and the live site stays as it was.
name: bills-refresh

on:
  schedule:
    - cron: "53 12 * * *" # 12:53 UTC every day, after the bills repository's own refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bills-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      line: ${{ steps.changed.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the bills repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/clinx-340b-bills
          path: _bills
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the locked dependencies
        run: npm ci
      - name: Copy the tables in
        run: node scripts/sync-bills.mjs _bills
      - name: Have the tables changed?
        id: changed
        run: |
          if [ -n "$(git status --porcelain src/data/bills public/data)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          echo "line=$(git -C _bills log -1 --format=%s | cut -c1-120)" >> "$GITHUB_OUTPUT"
      - name: Copied files match their records
        run: npm run check:data
      - name: Types
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Built site passes the safety scan
        run: npm run check:dist
      - name: Keep the built site and the copied tables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            dist/
            src/data/bills/
            public/data/bills.csv
            public/data/notices.csv
            public/data/events.csv
            public/data/340b-bills.json
            public/data/340b-notices.json
            public/data/340b-events.json
          if-no-files-found: error

  publish:
    # Runs only after a full pass, only when the tables changed, and only once the owner has switched it on.
    needs: refresh
    if: ${{ needs.refresh.result == 'success' && needs.refresh.outputs.changed == 'true' && vars.BILLS_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - name: Put the checked site in place
        run: mv _site/dist dist
      - name: Publish to ClinX.org
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy/publish.sh

  record:
    # After a publish, keep the copied tables in the repository so ordinary builds show the same thing.
    needs: [refresh, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - name: Commit the copied tables
        env:
          LINE: ${{ needs.refresh.outputs.line }}
        run: |
          cp _site/src/data/bills/* src/data/bills/
          cp _site/public/data/bills.csv _site/public/data/notices.csv _site/public/data/events.csv _site/public/data/340b-bills.json _site/public/data/340b-notices.json _site/public/data/340b-events.json public/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/bills public/data/bills.csv public/data/notices.csv public/data/events.csv public/data/340b-bills.json public/data/340b-notices.json public/data/340b-events.json
          git diff --cached --quiet || git commit -m "Bills, notices and calendar tables: $LINE"
          git push

  report-failure:
    needs: [refresh, publish, record]
    if: ${{ always() && (needs.refresh.result == 'failure' || needs.publish.result == 'failure' || needs.record.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Bills refresh failed on $(date -u +%F)" --body "The bills refresh did not pass, so nothing was published. The live site is unchanged.

          Run: $RUN_URL

          The run's log names the step that failed."
